[project]
name = "citrinet-export"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "esp-ppq>=1.3.11",
    "jiwer>=4.0.0",
    "librosa>=1.0.0",
    "numpy>=2.5.3",
    "onnx>=1.17.0",
    "onnxruntime>=1.30.0",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
